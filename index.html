<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지? | 저녁 메뉴 추천</title>
    <style>
        /* 기본 스타일 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 카드 컨테이너 */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 26px;
            color: #333;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        /* 메뉴 디스플레이 상자 */
        .menu-display {
            background-color: #fff8f0;
            border: 2px dashed #ff9f43;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .category-badge {
            font-size: 13px;
            background-color: #ff9f43;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: none;
        }

        .menu-name {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            word-break: keep-all;
        }

        /* 추천 버튼 */
        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .btn:hover {
            background-color: #ee5253;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 슬롯머신 효과 애니메이션 */
        .rolling {
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
        <p class="subtitle">결정 장애를 해결해 드립니다! 버튼을 눌러보세요.</p>

        <div class="menu-display" id="menuDisplay">
            <span class="category-badge" id="categoryBadge">한식</span>
            <div class="menu-name" id="menuName">버튼을 눌러 추천받으세요!</div>
        </div>

        <button class="btn" id="recommendBtn" onclick="getRecommendation()">메뉴 추천받기 🎲</button>
    </div>

    <script>
        // 저녁 메뉴 데이터 리스트 (카테고리 + 메뉴명)
        const menuList = [
            // 한식
            { category: "한식 🍚", name: "김치찌개와 계란말이" },
            { category: "한식 🍚", name: "삼겹살과 쌈채소" },
            { category: "한식 🍚", name: "제육볶음" },
            { category: "한식 🍚", name: "된장찌개와 고등어구이" },
            { category: "한식 🍚", name: "닭볶음탕" },
            { category: "한식 🍚", name: "소머리국밥 / 국밥" },
            { category: "한식 🍚", name: "비빔밥" },
            { category: "한식 🍚", name: "족발과 보쌈" },
            
            // 일식
            { category: "일식 🍱", name: "모듬 초밥" },
            { category: "일식 🍱", name: "바삭한 돈카츠" },
            { category: "일식 🍱", name: "따뜻한 우동과 튀김" },
            { category: "일식 🍱", name: "진한 라멘" },
            { category: "일식 🍱", name: "사케동 (연어덮밥)" },

            // 중식
            { category: "중식 🍜", name: "짜장면과 탕수육" },
            { category: "중식 🍜", name: "얼큰한 짬뽕" },
            { category: "중식 🍜", name: "마라탕과 꿔바로우" },
            { category: "중식 🍜", name: "볶음밥과 군만두" },

            // 양식/양식류
            { category: "양식 🍝", name: "토마토 / 크림 파스타" },
            { category: "양식 🍝", name: "화덕 피자" },
            { category: "양식 🍝", name: "수제 버거와 감자튀김" },
            { category: "양식 🍝", name: "스테이크와 샐러드" },

            // 분식/가벼운 식사
            { category: "분식 떡볶이", name: "떡볶이와 튀김, 순대" },
            { category: "간편식 샌드위치", name: "샌드위치와 샐러드" },
            { category: "야식/치킨 🍗", name: "바삭한 후라이드/양념 치킨" }
        ];

        let isSpinning = false;

        function getRecommendation() {
            if (isSpinning) return; // 이미 추천 중이면 중복 클릭 방지
            isSpinning = true;

            const menuDisplay = document.getElementById('menuDisplay');
            const categoryBadge = document.getElementById('categoryBadge');
            const menuName = document.getElementById('menuName');
            const btn = document.getElementById('recommendBtn');

            // 버튼 비활성화
            btn.disabled = true;
            btn.innerText = "추천 중... 🤔";
            menuDisplay.classList.add('rolling');

            // 1.5초 동안 랜덤하게 빠르게 바뀌는 롤링 효과
            let counter = 0;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * menuList.length);
                categoryBadge.style.display = "inline-block";
                categoryBadge.innerText = menuList[randomIndex].category;
                menuName.innerText = menuList[randomIndex].name;
                counter++;
            }, 80);

            // 1.5초 후 최종 메뉴 확정
            setTimeout(() => {
                clearInterval(interval);
                menuDisplay.classList.remove('rolling');

                // 최종 랜덤 선택
                const finalChoice = menuList[Math.floor(Math.random() * menuList.length)];
                categoryBadge.innerText = finalChoice.category;
                menuName.innerText = finalChoice.name;

                // 버튼 원상복구
                btn.disabled = false;
                btn.innerText = "다시 추천받기 🔄";
                isSpinning = false;
            }, 1500);
        }
    </script>
</body>
</html>
